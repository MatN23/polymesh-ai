# Create the pyproject.toml file
cat > pyproject.toml << 'EOF'
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymesh-ai"
version = "0.3.4"
authors = [
    {name = "Matias Nielsen"}
]
description = "A library for mesh processing with transformers"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12.0",
    "numpy>=1.21.0",
    "tqdm>=4.62.0",
]

[tool.setuptools]
packages = ["polymesh_ai"]
EOF

# Now verify the file was created
cat pyproject.toml

# Check your directory structure
ls -la

# You should see:
# - pyproject.toml (just created)
# - polymesh_ai/ (your package directory)

# If polymesh_ai/ doesn't exist, check what directories you have:
ls -d */

# Now try installing
pip install -e .